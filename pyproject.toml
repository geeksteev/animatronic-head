[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "animatronic-brain"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "numpy>=1.24"]

[project.optional-dependencies]
bench = ["opencv-python-headless>=4.8", "pyserial>=3.5"]

[tool.setuptools.packages.find]
include = ["brain*", "bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
