# Human-owned. Agents' tokens have no Workflows permission, and the reviewer rejects PRs touching .github/.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Protected paths
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if echo "$changed" | grep -Eq '^(config/limits|\.github/)'; then
            echo "::error::PR modifies config/limits* or .github/ (human-owned)."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Firmware build (PlatformIO)
        run: |
          mapfile -t projects < <(find . -name platformio.ini -not -path './.git/*' -printf '%h\n')
          if [ "${#projects[@]}" -eq 0 ]; then
            echo "No PlatformIO projects yet."
            exit 0
          fi
          pip install --quiet platformio
          for p in "${projects[@]}"; do
            echo "::group::pio run -d $p"
            pio run -d "$p"
            echo "::endgroup::"
          done

      - name: Python tests
        run: |
          if [ ! -d tests ] && [ ! -f pyproject.toml ]; then
            echo "No Python tests yet."
            exit 0
          fi
          pip install --quiet pytest pyyaml
          if [ -f requirements.txt ]; then pip install --quiet -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install --quiet -e .; fi
          pytest -q
