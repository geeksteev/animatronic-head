; ESP32 eye firmware: UDP listener driving the 6 eye servos. All motion logic lives in lib/eye_core.
; Build: pio run -d firmware/eyes_esp32    Flash: pio run -d firmware/eyes_esp32 -t upload

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    madhephaestus/ESP32Servo@3.0.5
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
